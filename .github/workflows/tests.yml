name: Fish Fight Macro Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fish-fight-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python 3.12 / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: python -m pip install --upgrade pip numpy opencv-python-headless
      - name: Install Windows runtime dependencies
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Smoke-import the Windows application
        if: runner.os == 'Windows'
        run: python -c "import fishfight_macro; print('Windows application imports successfully')"
      - name: Compile Python files
        run: python -m compileall -q fishfight fishfight_macro.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Package source ZIP
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          files = [Path("README.md"), Path("requirements.txt"), Path("fishfight_macro.py")]
          files += sorted(Path("fishfight").glob("*.py"))
          files += sorted(Path("tests").glob("*.py"))
          with ZipFile("dist/SharkmanFishFightMacro.zip", "w", ZIP_DEFLATED) as archive:
              for path in files:
                  archive.write(path, path.as_posix())
          PY
      - name: Upload source ZIP
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: Sharkman-Fish-Fight-Macro
          path: dist/SharkmanFishFightMacro.zip
          if-no-files-found: error
