name: Fish Fight Macro Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy opencv-python-headless
      - name: Compile Python files
        run: python -m compileall -q fishfight fishfight_macro.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Package source ZIP
        run: |
          mkdir -p dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          files = [Path("README.md"), Path("requirements.txt"), Path("fishfight_macro.py")]
          files += sorted(Path("fishfight").glob("*.py"))
          files += sorted(Path("tests").glob("*.py"))
          with ZipFile("dist/SharkmanFishFightMacro.zip", "w", ZIP_DEFLATED) as archive:
              for path in files:
                  archive.write(path, path.as_posix())
          PY
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Sharkman-Fish-Fight-Macro
          path: dist/SharkmanFishFightMacro.zip
          if-no-files-found: error
