name: Build Windows EXE

on:
  push:
    branches:
      - master
      - build/windows-exe
    paths:
      - "WINDOWS/**"
      - "packaging/**"
      - ".github/workflows/build-windows-exe.yml"
  pull_request:
    paths:
      - "WINDOWS/**"
      - "packaging/**"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install app dependencies and PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r WINDOWS/requirements.txt pyinstaller

      - name: Validate source syntax
        shell: pwsh
        run: |
          python -m compileall -q WINDOWS packaging
          python -m unittest discover -s WINDOWS/tests

      - name: Build standalone GUI executable
        shell: pwsh
        run: |
          $pyArgs = @(
            "--noconfirm",
            "--clean",
            "--onefile",
            "--windowed",
            "--name", "FishingMacro",
            "--paths", "WINDOWS",
            "--runtime-hook", "packaging/windows_runtime_hook.py",
            "--add-data", "WINDOWS;.",
            "--collect-all", "customtkinter",
            "--collect-all", "cv2",
            "--collect-all", "numpy",
            "--collect-all", "mss",
            "--collect-all", "pygetwindow",
            "--collect-all", "keyboard",
            "--collect-all", "PIL",
            "--collect-all", "keyring",
            "--collect-submodules", "keyring.backends",
            "--collect-submodules", "bloxfish",
            "WINDOWS/easy_run.py"
          )
          python -m PyInstaller @pyArgs
          if (!(Test-Path "dist/FishingMacro.exe")) {
            throw "PyInstaller did not produce dist/FishingMacro.exe"
          }
          $size = (Get-Item "dist/FishingMacro.exe").Length
          Write-Host "Built FishingMacro.exe ($size bytes)"
          if ($size -lt 10000000) {
            throw "Executable is unexpectedly small ($size bytes); refusing to publish it."
          }

      - name: Smoke-test the packaged application
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/FishingMacro.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          $process.Refresh()
          if ($process.HasExited) {
            $exitCode = $process.ExitCode
            Write-Host "Executable exited during GUI startup (exit code $exitCode)."
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-2) } -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -match 'Application Error|Windows Error Reporting|\.NET Runtime' } |
              Select-Object -First 10 TimeCreated, ProviderName, Id, Message |
              Format-List
            throw "Packaged GUI did not remain running during the smoke test."
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "PASS: executable stayed running through GUI startup."

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: FishingMacro-Windows-x64
          path: dist/FishingMacro.exe
          if-no-files-found: error
          retention-days: 30
